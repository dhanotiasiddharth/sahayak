# Self-host stack: this is what the buyer runs in their own cloud.
services:
  api:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sahayak, POSTGRES_USER: sahayak, POSTGRES_PASSWORD: sahayak }
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
volumes: { pgdata: {} }
